<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio</title>
  <link rel="icon" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Audio</h1>
  </header>

  <main>
    <div id="playlists" class="playlist-container"></div>
    <button id="shuffle-above">Перемешать всё</button>
    <div id="track-list"></div>
  </main>

  <footer class="player">
    <button id="prev-btn">⏮️</button>
    <button id="play-pause-btn">▶️</button>
    <button id="next-btn">⏭️</button>
    <div id="now-playing">Ничего не играет</div>
    <audio id="audio-element" preload="auto" playsinline></audio>
  </footer>

  <script>
    // ===================== ПЕРЕМЕННЫЕ =====================
    const audio = document.getElementById("audio-element");
    const playPauseBtn = document.getElementById("play-pause-btn");
    const nextBtn = document.getElementById("next-btn");
    const prevBtn = document.getElementById("prev-btn");
    const nowPlaying = document.getElementById("now-playing");
    const shuffleAboveBtn = document.getElementById("shuffle-above");

    let playlistsData = [];
    let linksData = [];
    let filteredTracks = [];
    let playingTracks = [];
    let playingIndex = -1;
    let playingMode = "order";
    let playingShuffleOrder = [];
    let playingShufflePos = 0;

    let nextAudio = null;
    let nextNextAudio = null;
    let pendingAutoplay = false;
    let playRetryTimer = null;
    const preconnected = new Set();
    let preloadAbort = null;

    // ===================== УТИЛИТЫ =====================
    function setPlayIcon(paused) {
      playPauseBtn.textContent = paused ? "▶️" : "⏸️";
    }

    function getTrackLinkByName(name) {
      const linkObj = linksData.find(l => l.name === name);
      return linkObj ? linkObj.link : null;
    }

    function highlightCurrentPlaying() {
      document.querySelectorAll(".track").forEach(div => div.classList.remove("active"));
      if (playingIndex >= 0 && playingIndex < playingTracks.length) {
        const track = playingTracks[playingIndex];
        const div = document.querySelector(`[data-name='${track.name}']`);
        if (div) div.classList.add("active");
      }
    }

    function originFrom(url) {
      try { return new URL(url, location.href).origin; } catch { return null; }
    }
    function preconnectOnce(url) {
      const o = originFrom(url);
      if (!o || preconnected.has(o)) return;
      const link = document.createElement('link');
      link.rel = 'preconnect';
      link.href = o;
      link.crossOrigin = 'anonymous';
      document.head.appendChild(link);
      preconnected.add(o);
    }
    function makePreloader(src) {
      const a = new Audio();
      a.preload = 'auto';
      a.src = src;
      return a;
    }
    function cleanupPreloaders() {
      if (preloadAbort) { try { preloadAbort.abort(); } catch {} }
      preloadAbort = new AbortController();
      if (nextAudio) { nextAudio.src = ''; nextAudio = null; }
      if (nextNextAudio) { nextNextAudio.src = ''; nextNextAudio = null; }
    }

    function tryPlayWithFallback() {
      try {
        const p = audio.play();
        if (p && typeof p.then === "function") {
          p.then(() => { pendingAutoplay = false; setPlayIcon(false); })
           .catch(() => { pendingAutoplay = true; setPlayIcon(true); });
        } else {
          pendingAutoplay = false; setPlayIcon(false);
        }
      } catch {
        pendingAutoplay = true; setPlayIcon(true);
      }
      if (playRetryTimer) clearTimeout(playRetryTimer);
      playRetryTimer = setTimeout(() => {
        if (pendingAutoplay) audio.play().catch(()=>{});
      }, 1500);
    }

    audio.addEventListener('timeupdate', () => {
      if (playRetryTimer) { clearTimeout(playRetryTimer); playRetryTimer = null; }
      pendingAutoplay = false; setPlayIcon(false);
    });
    audio.addEventListener('stalled', () => {
      if (!audio.paused && !pendingAutoplay) audio.play().catch(()=>{});
    });

    // ===================== ВОСПРОИЗВЕДЕНИЕ =====================
    function playFromPlaying(resumeTime = null) {
      if (playingIndex < 0 || playingIndex >= playingTracks.length) return;

      const track = playingTracks[playingIndex];
      const audioSrc = getTrackLinkByName(track.name);
      if (!audioSrc) {
        nowPlaying.textContent = "Ссылка на трек не найдена";
        setPlayIcon(true);
        return;
      }

      if (playRetryTimer) { clearTimeout(playRetryTimer); playRetryTimer = null; }
      pendingAutoplay = false;

      audio.pause();
      audio.src = audioSrc;
      audio.load();

      nowPlaying.textContent = `Сейчас играет: ${track.artist} — ${track.title}`;

      if (resumeTime != null && !Number.isNaN(resumeTime)) {
        try { audio.currentTime = resumeTime; } catch {}
      }

      tryPlayWithFallback();
      audio.addEventListener('canplay', () => {
        if (pendingAutoplay) tryPlayWithFallback();
      }, { once: true });

      highlightCurrentPlaying();
      updateNextPreload();
    }

    function updateNextPreload() {
      cleanupPreloaders();

      const inside = (i) => i >= 0 && i < playingTracks.length;
      let n1 = -1, n2 = -1;

      if (playingMode === "shuffle" && playingShuffleOrder.length) {
        if (playingShufflePos + 1 < playingShuffleOrder.length) n1 = playingShuffleOrder[playingShufflePos + 1];
        if (playingShufflePos + 2 < playingShuffleOrder.length) n2 = playingShuffleOrder[playingShufflePos + 2];
      } else {
        if (playingIndex + 1 < playingTracks.length) n1 = playingIndex + 1;
        if (playingIndex + 2 < playingTracks.length) n2 = playingIndex + 2;
      }

      const srcs = [];
      if (inside(n1)) { const s1 = getTrackLinkByName(playingTracks[n1].name); if (s1) srcs.push(s1); }
      if (inside(n2)) { const s2 = getTrackLinkByName(playingTracks[n2].name); if (s2) srcs.push(s2); }

      srcs.forEach(preconnectOnce);
      try {
        if (srcs[0]) nextAudio = makePreloader(srcs[0]);
        if (srcs[1]) nextNextAudio = makePreloader(srcs[1]);
      } catch {}
    }

    // ===================== ОБРАБОТЧИКИ =====================
    playPauseBtn.onclick = () => {
      if (pendingAutoplay) {
        pendingAutoplay = false;
        audio.play().then(()=> setPlayIcon(false)).catch(()=> setPlayIcon(true));
        return;
      }
      if (audio.paused) {
        audio.play().then(()=> setPlayIcon(false)).catch(()=>{
          pendingAutoplay = true;
          setPlayIcon(true);
        });
      } else {
        audio.pause();
        setPlayIcon(true);
      }
    };

    nextBtn.onclick = () => {
      if (playingMode === "shuffle" && playingShuffleOrder.length) {
        if (playingShufflePos + 1 < playingShuffleOrder.length) {
          playingShufflePos++;
          playingIndex = playingShuffleOrder[playingShufflePos];
          playFromPlaying();
        }
      } else if (playingIndex + 1 < playingTracks.length) {
        playingIndex++;
        playFromPlaying();
      }
    };

    prevBtn.onclick = () => {
      if (playingMode === "shuffle" && playingShuffleOrder.length) {
        if (playingShufflePos > 0) {
          playingShufflePos--;
          playingIndex = playingShuffleOrder[playingShufflePos];
          playFromPlaying();
        }
      } else if (playingIndex > 0) {
        playingIndex--;
        playFromPlaying();
      }
    };

    audio.addEventListener("ended", () => nextBtn.onclick());

    // ===================== РЕНДЕР =====================
    function renderTracks(tracks) {
      const container = document.getElementById("track-list");
      container.innerHTML = "";
      filteredTracks = tracks.slice();
      tracks.forEach((t, i) => {
        const div = document.createElement("div");
        div.className = "track";
        div.dataset.name = t.name;
        div.textContent = `${t.artist} — ${t.title}`;
        div.onclick = () => {
          if (
            playingTracks.length &&
            playingTracks[playingIndex] &&
            playingTracks[playingIndex].name === t.name
          ) {
            if (audio.paused) { audio.play(); setPlayIcon(false); }
            else { audio.pause(); setPlayIcon(true); }
            return;
          }
          playingTracks = filteredTracks.slice();
          playingIndex = i;
          playingMode = "order";
          playingShuffleOrder = [];
          playingShufflePos = 0;
          playFromPlaying();
        };
        container.appendChild(div);
      });
      highlightCurrentPlaying();
    }

    function renderPlaylists(playlists) {
      const container = document.getElementById("playlists");
      container.innerHTML = "";
      playlists.slice(0, 7).forEach((pl) => {
        const div = document.createElement("div");
        div.className = "playlist";
        div.innerHTML = `<img src="${pl.cover}" alt=""><div><b>${pl.title}</b><br>${pl.author}</div>`;
        div.onclick = () => filterTracksByPlaylist(pl);
        container.appendChild(div);
      });
    }

    function filterTracksByPlaylist(playlist) {
      const listFolder = playlist.list;
      fetch(`playlists/${listFolder}/tracks.json`)
        .then(res => res.json())
        .then(playlistTracks => {
          filteredTracks = playlistTracks;
          renderTracks(playlistTracks);
        })
        .catch(err => console.error("Failed to load tracks:", err));
    }

    // ===================== SHUFFLE =====================
    shuffleAboveBtn && (shuffleAboveBtn.onclick = () => {
      if (filteredTracks.length === 0) return;

      const currentId = (playingTracks[playingIndex] && playingTracks[playingIndex].name) ? playingTracks[playingIndex].name : null;
      const resume = (!Number.isNaN(audio.currentTime)) ? audio.currentTime : 0;

      if (playingMode === "shuffle") {
        playingMode = "order";
        if (currentId) {
          const idx = playingTracks.findIndex(t => t.name === currentId);
          if (idx !== -1) playingIndex = idx;
        }
        playFromPlaying(resume);
      } else {
        playingTracks = filteredTracks.slice();
        let anchorIndex = 0;
        if (currentId) {
          const idx = playingTracks.findIndex(t => t.name === currentId);
          if (idx !== -1) anchorIndex = idx;
        }
        playingShuffleOrder = playingTracks.map((_, i) => i).sort(() => Math.random() - 0.5);
        const pos = playingShuffleOrder.indexOf(anchorIndex);
        playingShufflePos = pos >= 0 ? pos : 0;
        playingIndex = playingShuffleOrder[playingShufflePos];
        playingMode = "shuffle";
        playFromPlaying(resume);
      }
    });

    // ===================== ИНИЦИАЛИЗАЦИЯ =====================
    fetch('links.json')
      .then(r => r.json())
      .then(links => {
        linksData = links;
        return fetch('playlists.json');
      })
      .then(r => r.json())
      .then(playlists => {
        playlistsData = playlists;
        renderPlaylists(playlistsData);
        const plFromUrl = new URLSearchParams(location.search).get('playlist');
        const initial = (plFromUrl && playlistsData.find(p => p.list === plFromUrl)) || playlistsData[0];
        if (initial) filterTracksByPlaylist(initial);
      })
      .catch(err => console.error('Failed to load data:', err));
  </script>
</body>
</html>
