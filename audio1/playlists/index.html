<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Все плейлисты</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Все плейлисты</h1>
    <a href="../" style="color: #fff; text-decoration: underline;">← На главную</a>
  </header>
  <div class="playlists-section" style="max-width: 1200px; margin: 0 auto;">
    <div id="playlists-list" class="playlists-list" style="flex-wrap: wrap; overflow: visible;"></div>
  </div>
  <script>
    fetch('playlists.json')
      .then(res => res.json())
      .then(playlists => {
        const playlistsList = document.getElementById('playlists-list');
        playlistsList.innerHTML = '';
        playlists.forEach(pl => {
          const div = document.createElement('div');
          div.className = 'playlist-card';
          div.innerHTML = `
            <img src="${pl.cover}" alt="${pl.title}" class="playlist-cover"/>
            <div class="playlist-title">${pl.title}</div>
            <div class="playlist-author">${pl.author}</div>
          `;
          // Переход на главную с нужным плейлистом в параметре URL
          div.addEventListener('click', () => {
            window.location.href = `../index.html?playlist=${encodeURIComponent(pl.list)}`;
          });
          playlistsList.appendChild(div);
        });
      });
  </script>
</body>
</html>
