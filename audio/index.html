<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" >
  <title>my audio</title>
  <link rel="icon" type="image/png" href="/audio/favicon.png?v=2">
  <meta name="viewport" content="width=device-width, initial-scale=1" >
  <link rel="stylesheet" href="style.css" >
  <style>
    :root { --rail:#2a2b2f; --card:#1c1d22; --accent:#3b82f6; }

    /* нижняя панель по умолчанию скрыта */
    .bottom-player { display:none; }

    /* Показ нижней панели на мобилках или узком окне (удобно тестить) */
    @media ( (hover:none) and (pointer:coarse) ), (max-width:900px) {
      body { padding-bottom: 148px; }
      .bottom-player{
        display:block;
        position:fixed; left:0; right:0; bottom:0;
        z-index:1000;
        background:#111;
        border-top:1px solid #222;
        padding:22px 12px calc(12px + env(safe-area-inset-bottom));               /* !!!!!! первое сверху, второе сбоку, третье снизу */
      }
      .bp-top{ display:flex; align-items:center; gap:10px; margin:0 4px 10px; }
      .bp-time{ color:#cfd1d6; font-size:13px; min-width:46px; }
      .bp-time.right{ text-align:right; }
      #bp-seek{
        flex:1; appearance:none; height:8px; border-radius:999px;
        background:var(--rail); outline:none;
      }
      .controls{
        display:flex; align-items:center; justify-content:space-between; gap:12px;
        padding-top: 20px;                                                        /* !!!!!! между плеером и кнопками */
        padding-bottom: 12px;
      }
      .big-btn{
        font-size:28px; line-height:1; color:#fff;                                /* !!!!!! размеры кнопок можно увеличивать */
        background:var(--card); border:0; border-radius:18px;
        padding:18px; min-width:72px; min-height:72px; cursor:pointer;
        -webkit-tap-highlight-color: rgba(0,0,0,0);
      }
      .big-btn:active{ transform: translateY(1px); }
      .big-btn.toggle.active{ outline:2px solid var(--accent); }
    }

    /* Подсветка верхних toggle-кнопок */
    .player-btn.toggle.active{ outline:2px solid var(--accent); }

    /* Мобильный пресет: больше треки, без правого "поля", удобные тач-зоны */
    @media ((hover: none) and (pointer: coarse)) , (max-width: 900px) {
      /* контейнер на всю ширину экрана */
      .main-card {
        max-width: 100%;
        padding-left: 10px;
        padding-right: 10px;
      }

      /* список треков — без лишних отступов и с полной шириной */
      #track-list {
        margin-left: 0;
        margin-right: 0;
        padding-left: 0;
        padding-right: 0;
      }

      /* сами треки — крупнее и "толще" */
      .track {
        display: block;
        width: 100%;
        box-sizing: border-box;
        font-size: clamp(17px, 3vw, 21px);
        line-height: 1.25;
        padding: 14px 16px;
        margin: 10px 0;
        border-radius: 12px;
        -webkit-tap-highlight-color: rgba(0,0,0,0);
      }

      /* чтобы верхняя панель не съедала место: визуально компактнее */
      .player-bar {
        gap: 8px;
      }
      .player-seekbar {
        height: 8px;
      }
    }

    /* Мобилка: скрыть верхний плеер, оставить заголовок + поиск в ОДНУ строку */
    @media ((hover: none) and (pointer: coarse)) , (max-width: 900px) {
      /* скрыть верхний плеер и "Сейчас играет" */
      .player-bar,
      #now-playing {
        display: none !important;
      }

      /* заголовок + поиск в одну линию */
      .header-row {
        display: flex;
        flex-direction: row;      /* важно: обратно в строку */
        align-items: center;
        gap: 10px;
        padding-left: 12px;
        padding-right: 12px;
      }

      /* заголовок не переносим и не растягиваем */
      .header-row h1 {
        margin: 0;
        white-space: nowrap;
        flex: 0 0 auto;
      }

      /* контейнер поиска занимает всё оставшееся */
      .search-container {
        margin-left: 18px;        /* отступ до строка поиска */
        flex: 1 1 auto;
        max-width: none;
        display: flex;
      }

      /* инпут поиска растягивается полностью, без минималки */
      #search-input {
        width: 100% !important;
        min-width: 0 !important;
        max-width: none !important;
        box-sizing: border-box;
        margin: 0;
      }
    }

    /* === MOBILE FIXES === */
    @media ((hover:none) and (pointer:coarse)) , (max-width:900px) {

      /* 1) Реальный запас под высокий нижний плеер */
      :root { --bp-safe: 60px; } /* подгони под свою высоту панели */

      /* запас для страницы + safe area */
      body { padding-bottom: calc(var(--bp-safe) + env(safe-area-inset-bottom)) !important; }

      /* если скроллится основной контент — тоже добавим запас */
      main, #track-list {
        padding-bottom: calc(var(--bp-safe) + 16px + env(safe-area-inset-bottom));
      }

      /* 2) Шапка должна быть чёрной во всю ширину
            Причина «полосок» — паддинги у .main-card на мобилке. Убираем их. */
      .main-card { padding-left: 0; padding-right: 0; }

      /* добавим горизонтальные поля контенту вместо .main-card */
      header .header-row { padding-left: 12px; padding-right: 12px; }
      .playlists-section { padding-left: 12px; padding-right: 12px; }
      main { padding-left: 12px; padding-right: 12px; }
    }



  </style>
<link rel="stylesheet" href="player.css"></head>
<body>
  <div class="main-card">
    <header>
      <div class="header-row">
        <h1>Audio</h1>
        <div class="search-container">
          <input id="search-input" type="text" placeholder="Поиск музыки..." autocomplete="off" aria-label="Поиск музыки">
        </div>
      <div class="mobile-volume-control"><button type="button" id="mobile-volume-toggle" class="volume-button" aria-label="Громкость" aria-expanded="false" aria-controls="mobile-volume-popup">🔊</button><div id="mobile-volume-popup" class="mobile-volume-popup" hidden><button type="button" id="mobile-volume-mute" class="volume-button" aria-label="Выключить звук">🔊</button><input id="mobile-volume" type="range" min="0" max="100" value="100" step="1" aria-label="Громкость на телефоне"></div></div></div>

      
      <div class="player-bar">
        <button id="prev" class="player-btn" aria-label="Предыдущий трек">⏮️</button>
        <button id="play-pause" class="player-btn" aria-label="Воспроизвести">▶️</button>
        <button id="next" class="player-btn" aria-label="Следующий трек">⏭️</button>

        
        <button id="top-shuffle" class="player-btn toggle" title="Перемешать" aria-label="Перемешивание">🔀</button>
        <button id="top-repeat" class="player-btn toggle" title="Зациклить" aria-label="Повтор трека">🔁</button>

        <input type="range" id="seekbar" value="0" min="0" max="100" step="0.01" class="player-seekbar" aria-label="Позиция трека">
        <span id="current-time" class="player-time">0:00</span>
      <div class="volume-control"><button type="button" id="volume-mute" class="volume-button" aria-label="Выключить звук">🔊</button><input id="volume" type="range" min="0" max="100" value="100" step="1" aria-label="Громкость"><output id="volume-value" for="volume">100%</output></div></div>

      <div class="playback-info"><button type="button" id="now-playing" class="now-playing queue-open" aria-haspopup="dialog">Сейчас ничего не играет</button>
      <div class="playback-feedback"><p id="playback-status" role="status" aria-live="polite"></p><button id="playback-retry" type="button" hidden>Повторить</button></div></div><audio id="audio-element" preload="auto" playsinline></audio>
    </header>

    
    <div class="playlists-section">
      <div class="playlists-header">
        <h2>Плейлисты</h2>
        <button id="show-all-playlists" style="display:none;">Показать все</button>
      </div>
      <div id="playlists-list" class="playlists-list"></div>
    </div>

    <main>
      <button id="shuffle-above-tracks" class="shuffle-above-tracks" style="display:none;">
        <span class="shuffle-icon">🔀</span> Перемешать всё
      </button>
      <div id="track-list"></div>
    </main>
  </div>

  
  <div class="bottom-player" aria-label="Плеер">
    <div class="bp-top">
      <span class="bp-time" id="bp-time-left">0:00</span>
      <input type="range" id="bp-seek" value="0" min="0" max="100" step="0.01" aria-label="Позиция трека на телефоне">
      <span class="bp-time right" id="bp-time-right">-0:00</span>
    </div>
    <div class="controls">
      <button id="bottom-shuffle" class="big-btn toggle" title="Перемешать" aria-label="Перемешивание">🔀</button>
      <button id="bottom-prev" class="big-btn" title="Предыдущий" aria-label="Предыдущий трек">⏮️</button>
      <button id="bottom-play-pause" class="big-btn" title="Пауза/Воспроизвести" aria-label="Воспроизвести">▶️</button>
      <button id="bottom-next" class="big-btn" title="Следующий" aria-label="Следующий трек">⏭️</button>
      <button id="bottom-repeat" class="big-btn toggle" title="Зациклить" aria-label="Повтор трека">🔁</button>
    </div>
    <button type="button" id="bp-title" class="bp-title queue-open" aria-haspopup="dialog">Выберите трек</button>
  </div>

<dialog id="queue-dialog" aria-labelledby="queue-title">
  <div class="queue-header"><h2 id="queue-title">Очередь воспроизведения</h2><button type="button" id="queue-close" aria-label="Закрыть очередь">✕</button></div>
  <p class="queue-caption">Сейчас играет</p><p id="queue-current"></p>
  <p class="queue-caption">Далее</p><p class="queue-hint">Перетаскивайте треки, чтобы изменить порядок.</p>
  <ol id="queue-list"></ol><p id="queue-empty" hidden>В очереди больше нет треков.</p>
</dialog>
<script type="module" src="js/app.mjs"></script>
</body>
</html>
