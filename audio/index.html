<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>my audio</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="main-card">
    <header>
      <div class="header-row">
        <h1>Audio</h1>
        <div class="search-container">
          <input id="search-input" type="text" placeholder="Поиск музыки..." autocomplete="off" />
        </div>
      </div>
      <!-- Твой плеер здесь -->
      <div class="player-bar">
        <button id="prev" class="player-btn">⏮️</button>
        <button id="play-pause" class="player-btn">▶️</button>
        <button id="next" class="player-btn">⏭️</button>
        <!-- <button id="shuffle" class="player-btn">🔀</button> -->
        <input type="range" id="seekbar" value="0" min="0" max="100" step="0.01" class="player-seekbar">
        <span id="current-time" class="player-time">0:00</span>
      </div>
      <div id="now-playing" class="now-playing">Сейчас ничего не играет</div>
      <audio id="audio-element" preload="auto"></audio>
    </header>
    <div class="playlists-section">
      <div class="playlists-header">
        <h2>Плейлисты</h2>
        <button id="show-all-playlists" style="display:none;">Показать все</button>
      </div>
      <div id="playlists-list" class="playlists-list"></div>
    </div>
    <main>
<!--     <button id="shuffle">🔀 Играть в случайном порядке</button>    -->
      <button id="shuffle-above-tracks" class="shuffle-above-tracks" style="display: none;">
        <span class="shuffle-icon">🔀</span> Перемешать всё
      </button>

      <div id="track-list"></div>
    </main>
  </div>
<script>
let playlistsData = [];
let visibleTracks = [];      // Треки выбранного плейлиста (видимые по умолчанию)
let playingTracks = [];      // Треки, по которым реально играет плеер
let playingIndex = -1;
let playingMode = "order";   // "order" или "shuffle"
let playingShuffleOrder = [];
let playingShufflePos = 0;
let linksData = [];
let filteredTracks = []; // Треки после поиска (видимые)

const audio = document.getElementById("audio-element");
const nowPlaying = document.getElementById("now-playing");
const playPauseBtn = document.getElementById("play-pause");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const seekbar = document.getElementById("seekbar");
const currentTimeSpan = document.getElementById("current-time");
const trackListDiv = document.getElementById("track-list");
const shuffleAboveBtn = document.getElementById('shuffle-above-tracks');
const searchInput = document.getElementById("search-input");
let seeking = false;

// --- Получение параметра из URL ---
function getQueryParam(name) {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(name);
}

// --- Загрузка links.json, playlists.json ---
fetch('links.json')
  .then(res => res.json())
  .then(links => {
    linksData = links;
    fetch('playlists/playlists.json')
      .then(res => res.json())
      .then(playlists => {
        playlistsData = playlists;
        renderPlaylists(playlistsData);

        // Открыть нужный плейлист (или "все треки" по умолчанию)
        const playlistFromUrl = getQueryParam('playlist');
        let initialPl = null;
        if (playlistFromUrl && playlistsData.length > 0) {
          initialPl = playlistsData.find(pl => pl.list === playlistFromUrl);
        }
        if (!initialPl && playlistsData.length > 0) {
          initialPl = playlistsData[0];
        }
        if (initialPl) {
          filterTracksByPlaylist(initialPl);
        }
      });
  });

// --- Отрисовка плейлистов ---
function renderPlaylists(playlists) {
  const playlistsList = document.getElementById('playlists-list');
  playlistsList.innerHTML = '';
  const maxVisible = 7; // ограничение на 7 плейлистов

  playlists.slice(0, maxVisible).forEach((pl) => {
    const div = document.createElement('div');
    div.className = 'playlist-card';
    div.innerHTML = `
      <img src="${pl.cover}" alt="${pl.title}" class="playlist-cover"/>
      <div class="playlist-title">${pl.title}</div>
      <div class="playlist-author">${pl.author || ''}</div>
    `;
    div.addEventListener('click', () => {
      filterTracksByPlaylist(pl);
    });
    playlistsList.appendChild(div);
  });

  // Кнопка "Показать все"
  const showAllBtn = document.getElementById('show-all-playlists');
  if (showAllBtn) {
    showAllBtn.style.display = playlists.length > maxVisible ? '' : 'none';
    showAllBtn.onclick = () => window.location.href = 'playlists/';
  }
}
  
// --- Показываем треки плейлиста (но не сбрасываем playingTracks) ---
function filterTracksByPlaylist(playlist) {
  const listFolder = playlist.list;
  fetch(`playlists/${listFolder}/tracks.json`)
    .then(res => res.json())
    .then(playlistTracks => {
      visibleTracks = playlistTracks;
      renderTracks(playlistTracks);
    });
}

// --- Отрисовка треков ---
function renderTracks(tracks) {
  filteredTracks = tracks.slice(); // каждый раз после фильтрации обновляем filteredTracks!
  trackListDiv.innerHTML = '';
  tracks.forEach((track, index) => {
    const trackDiv = document.createElement('div');
    trackDiv.className = 'track';
    trackDiv.textContent = `${track.artist} — ${track.title}`;
    trackDiv.onclick = () => {
      // Если клик по уже играющему треку — ставим на паузу/воспроизводим!
      if (
        playingTracks.length &&
        playingTracks[playingIndex] &&
        filteredTracks[index] &&
        playingTracks[playingIndex].name === filteredTracks[index].name
      ) {
        if (audio.paused) {
          audio.play();
          playPauseBtn.textContent = "⏸️";
        } else {
          audio.pause();
          playPauseBtn.textContent = "▶️";
        }
        return;
      }
      // Если клик по другому треку — запускаем очередь с него
      playingTracks = filteredTracks.slice();
      playingIndex = index;
      playingMode = "order";
      playingShuffleOrder = [];
      playingShufflePos = 0;
      playFromPlaying();
    };

    trackListDiv.appendChild(trackDiv);
  });
  updateShuffleAboveBtn();
  highlightCurrentPlaying();
}

// --- Shuffle кнопка над треками ---
function updateShuffleAboveBtn() {
  if (!shuffleAboveBtn) return;
  shuffleAboveBtn.style.display = filteredTracks.length > 1 ? '' : 'none';
}
shuffleAboveBtn.onclick = () => {
  if (filteredTracks.length === 0) return;
  playingTracks = filteredTracks.slice();
  playingShuffleOrder = playingTracks.map((_, i) => i).sort(() => Math.random() - 0.5);
  playingShufflePos = 0;
  playingMode = "shuffle";
  playingIndex = playingShuffleOrder[playingShufflePos];
  playFromPlaying();
};

// --- Поиск ---
searchInput && searchInput.addEventListener("input", function() {
  const query = searchInput.value.trim().toLowerCase();
  if (!query) {
    renderTracks(visibleTracks); // все видимые треки плейлиста
    return;
  }
  const filtered = visibleTracks.filter(
    t => (t.title && t.title.toLowerCase().includes(query)) ||
         (t.artist && t.artist.toLowerCase().includes(query))
  );
  renderTracks(filtered);
});

// --- Воспроизведение текущего playing-трека ---
function playFromPlaying() {
  if (playingIndex < 0 || playingIndex >= playingTracks.length) return;
  let track = playingTracks[playingIndex];
  let audioSrc = getTrackLinkByName(track.name);
  if (!audioSrc) {
    nowPlaying.textContent = "Ссылка на трек не найдена";
    playPauseBtn.textContent = "▶️";
    return;
  }
  audio.src = audioSrc;
  audio.play();
  nowPlaying.textContent = `Сейчас играет: ${track.artist} — ${track.title}`;
  playPauseBtn.textContent = "⏸️";
  highlightCurrentPlaying();
  updateNextPreload();
}

// --- Предзагрузка следующего трека ---
let nextAudio = null;
function updateNextPreload() {
  let nextIndex = -1;
  if (playingMode === "shuffle" && playingShuffleOrder && playingShufflePos + 1 < playingShuffleOrder.length) {
    nextIndex = playingShuffleOrder[playingShufflePos + 1];
  } else if (playingMode === "order" && playingIndex + 1 < playingTracks.length) {
    nextIndex = playingIndex + 1;
  }
  if (nextIndex >= 0 && nextIndex < playingTracks.length) {
    let nextTrack = playingTracks[nextIndex];
    let nextSrc = getTrackLinkByName(nextTrack.name);
    if (nextSrc) {
      if (nextAudio) nextAudio.src = "";
      nextAudio = new Audio();
      nextAudio.src = nextSrc;
      nextAudio.preload = "auto";
    }
  }
}

// --- Навигация prev/next ---
prevBtn.onclick = () => {
  if (playingMode === "shuffle") {
    playingShufflePos--;
    if (playingShufflePos >= 0 && playingShufflePos < playingShuffleOrder.length) {
      playingIndex = playingShuffleOrder[playingShufflePos];
      playFromPlaying();
    }
  } else {
    if (playingIndex > 0) {
      playingIndex--;
      playFromPlaying();
    }
  }
};
nextBtn.onclick = () => {
  if (playingMode === "shuffle") {
    playingShufflePos++;
    if (playingShufflePos < playingShuffleOrder.length) {
      playingIndex = playingShuffleOrder[playingShufflePos];
      playFromPlaying();
    }
  } else {
    if (playingIndex + 1 < playingTracks.length) {
      playingIndex++;
      playFromPlaying();
    }
  }
};

// --- Следующий трек после окончания ---
audio.onended = () => {
  if (playingMode === "shuffle") {
    playingShufflePos++;
    if (playingShufflePos < playingShuffleOrder.length) {
      playingIndex = playingShuffleOrder[playingShufflePos];
      playFromPlaying();
    } else {
      playPauseBtn.textContent = "▶️";
      highlightCurrentPlaying(-1);
    }
  } else {
    if (playingIndex + 1 < playingTracks.length) {
      playingIndex++;
      playFromPlaying();
    } else {
      playPauseBtn.textContent = "▶️";
      highlightCurrentPlaying(-1);
    }
  }
};

// --- Функция поиска ссылки по name ---
function getTrackLinkByName(name) {
  const found = linksData.find(linkObj => linkObj.name === name);
  return found ? found.link : null;
}

// --- Подсветка активного playing-трека ---
function highlightCurrentPlaying() {
  const trackDivs = document.querySelectorAll('#track-list .track');
  filteredTracks.forEach((track, i) => {
    if (
      playingTracks[playingIndex] &&
      track.name === playingTracks[playingIndex].name
    ) {
      trackDivs[i].classList.add('active');
    } else {
      trackDivs[i].classList.remove('active');
    }
  });
}

// --- Управление паузой (кнопка и пробел) ---
playPauseBtn.onclick = () => {
  if (audio.paused) {
    audio.play();
    playPauseBtn.textContent = "⏸️";
  } else {
    audio.pause();
    playPauseBtn.textContent = "▶️";
  }
};
document.addEventListener('keydown', function(e) {
  if (e.code === "Space" && !["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) {
    e.preventDefault();
    if (audio.paused) {
      audio.play();
      playPauseBtn.textContent = "⏸️";
    } else {
      audio.pause();
      playPauseBtn.textContent = "▶️";
    }
  }
});

// --- Перемотка (seekbar) + время ---
seekbar.addEventListener('input', (e) => {
  seeking = true;
  audio.currentTime = e.target.valueAsNumber;
});
seekbar.addEventListener('change', (e) => {
  audio.currentTime = e.target.valueAsNumber;
  seeking = false;
});
audio.addEventListener('loadedmetadata', () => {
  seekbar.max = audio.duration || 0;
  currentTimeSpan.textContent = "0:00";
});
audio.addEventListener('timeupdate', () => {
  if (!seeking) {
    seekbar.value = audio.currentTime;
  }
  currentTimeSpan.textContent = formatTime(audio.currentTime);
});
function formatTime(time) {
  if (isNaN(time) || !isFinite(time)) return "0:00";
  const minutes = Math.floor(time / 60);
  const seconds = Math.floor(time % 60);
  return minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
}

</script>





</body>
</html>
